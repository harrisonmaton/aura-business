name: recette
on: [push, pull_request]
jobs:
  recette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci || npm install
      - run: npx playwright install --with-deps chromium
      # La recette média encode du WebP : ffmpeg est requis en CI (sans lui, elle échoue en CI
      # et n'est « SKIPPED » qu'en local). L'archive Street n'est pas versionnée : on la reconstruit.
      - run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: npm run build:collection
      # Le job échoue si une assertion échoue : les scripts sortent en code 1.
      - run: npm test   # catalogue + recette + registre ; code 1 si un seul contrôle échoue
